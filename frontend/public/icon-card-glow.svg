<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="32" height="32" fill="none">
  <defs>
    <filter id="glow-crd" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#eab308" flood-opacity="0.9"/>
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(2, 2)" filter="url(#glow-crd)">
    <rect x="4" y="8" width="24" height="16" rx="4" fill="#713f12" stroke="#facc15" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <line x1="4" y1="13" x2="28" y2="13" stroke="#fde047" stroke-width="2.5"/>
    <rect x="8" y="17" width="5" height="3" rx="1" fill="#fef08a"/>
  </g>
</svg>
