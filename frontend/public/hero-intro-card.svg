<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250" fill="none">
  <style>
    .card-bg {
      fill: #060913;
      stroke: #1e293b;
      stroke-width: 1.5;
      rx: 20px;
    }
    .left-accent {
      stroke: #2563eb;
      stroke-width: 3.5;
      stroke-linecap: round;
    }
    .text-body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      fill: #cbd5e1;
    }
    .quote-box {
      fill: #04120a;
      stroke: #059669;
      stroke-width: 1.2;
      rx: 14px;
    }
    .quote-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #10b981;
    }
    .ecg-green {
      stroke: #10b981;
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: ecg-sweep 2.5s linear infinite;
    }
    @keyframes ecg-sweep {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <filter id="glow-intro" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="glow-green-ecg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Dark Glass Card Container -->
  <rect x="10" y="5" width="780" height="240" class="card-bg" filter="url(#glow-intro)"/>

  <!-- Left Blue Glowing Accent Bar -->
  <line x1="30" y1="25" x2="30" y2="160" class="left-accent" filter="url(#glow-intro)"/>

  <!-- Intro Paragraph Lines -->
  <g transform="translate(48, 30)">
    <text class="text-body" y="0">
      <tspan font-weight="700" fill="#ffffff">SehatSetu</tspan> is an <tspan font-weight="700" fill="#ffffff">AI and Machine Learning-powered healthcare platform</tspan>, built as a <tspan font-weight="700" fill="#ffffff">Progressive</tspan>
    </text>
    <text class="text-body" y="22">
      <tspan font-weight="700" fill="#ffffff">Web App</tspan>, that reimagines how patients across India connect with certified doctors — closing the
    </text>
    <text class="text-body" y="44">
      gap of distance, fragmented records, and language barriers with a single, intelligent digital bridge.
    </text>
    <text class="text-body" y="66">
      It brings together telemedicine, automated clinical documentation, electronic health records,
    </text>
    <text class="text-body" y="88">
      multilingual interaction, and personalized health guidance into one continuous experience, so that
    </text>
    <text class="text-body" y="110">
      healthcare feels less like a series of disconnected visits and more like an ongoing relationship
    </text>
    <text class="text-body" y="132">
      between patient and provider.
    </text>
  </g>

  <!-- Bottom Green Quote Card Box -->
  <g transform="translate(30, 180)">
    <rect width="740" height="46" class="quote-box"/>

    <!-- Green Quote Icon -->
    <circle cx="28" cy="23" r="13" fill="#042f1a"/>
    <text x="21" y="28" font-size="14" fill="#10b981" font-weight="900">❝</text>

    <!-- Quote Text -->
    <text x="52" y="28" class="quote-text">Quality healthcare should not depend on where a person lives.</text>

    <!-- Green Animated ECG Wave on Right Side of Quote Box -->
    <path class="ecg-green" filter="url(#glow-green-ecg)" d="M620,23 L670,23 L674,23 L678,13 L682,33 L686,7 L690,37 L694,18 L698,23 L720,23"/>
  </g>
</svg>
