<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="320" fill="none">
  <style>
    @keyframes bg-fall-down {
      0% {
        transform: translateY(-90px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }
    @keyframes wave-flow-1 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1200; }
    }
    @keyframes wave-flow-2 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1200; }
    }
    .main-canvas {
      animation: bg-fall-down 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .wave-line-1 {
      stroke: url(#wave-grad-1);
      stroke-width: 3.5;
      fill: none;
      stroke-dasharray: 600 600;
      animation: wave-flow-1 10s linear infinite;
    }
    .wave-line-2 {
      stroke: url(#wave-grad-2);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 400 400;
      animation: wave-flow-2 14s linear infinite;
    }
  </style>

  <defs>
    <!-- Dark Space Blue Canvas Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020713"/>
      <stop offset="50%" stop-color="#06163a"/>
      <stop offset="100%" stop-color="#01091d"/>
    </linearGradient>

    <!-- Top Left Flare -->
    <radialGradient id="flare-left" cx="12%" cy="12%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020713" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Right Flare -->
    <radialGradient id="flare-right" cx="88%" cy="12%" r="40%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#020713" stop-opacity="0"/>
    </radialGradient>

    <!-- Wave Gradient 1 -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>

    <!-- Wave Gradient 2 -->
    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Hexagon Pattern -->
    <pattern id="hexagons" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 0 57.735 L 0 80.829 L 20 92.376 L 40 80.829 L 40 57.735 L 20 46.188 Z" stroke="#1d4ed8" stroke-width="0.8" stroke-opacity="0.3" fill="none"/>
    </pattern>

    <!-- Dot Matrix Pattern -->
    <pattern id="dot-matrix" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Whole Background Cover Group Falling Down on Load -->
  <g class="main-canvas">
    <!-- Floating Medical Crosses -->
    <g transform="translate(930, 60)">
      <path d="M-10,0 L10,0 M0,-10 L0,10" stroke="#38bdf8" stroke-width="2.2" stroke-opacity="0.6" filter="url(#glow-heavy)"/>
    </g>
    <g transform="translate(70, 260)">
      <path d="M-8,0 L8,0 M0,-8 L0,8" stroke="#1d4ed8" stroke-width="1.8" stroke-opacity="0.5"/>
    </g>

    <!-- Continuous Flowing Glowing Waves at Bottom -->
    <path d="M -50 270 C 200 310, 450 250, 700 280 T 1100 240" class="wave-line-1" filter="url(#glow-heavy)"/>
    <path d="M -50 290 C 250 330, 500 230, 750 260 T 1100 210" class="wave-line-2"/>
  </g>
</svg>
