<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <defs>
    <filter id="glow-warn" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#f59e0b" flood-opacity="0.8"/>
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(2, 2)" filter="url(#glow-warn)">
    <path d="M16 3 L30 27 L2 27 Z" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M16 11 L16 19 M16 23 L16 24" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
