<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 48" width="100%" height="48" fill="none">
  <style>
    .card {
      fill: #090d1a;
      stroke: #2563eb;
      stroke-width: 1.5;
      rx: 12px;
    }
    .accent-bar {
      stroke: #3b82f6;
      stroke-width: 4;
      stroke-linecap: round;
    }
    .text-tagline {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 14.5px;
      fill: #ffffff;
    }
  </style>

  <defs>
    <!-- Multi-layered Glowing Neon Drop Shadow Filter -->
    <filter id="shadow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.5"/>
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(10, 4)">
    <!-- Shadowed Card Container -->
    <rect width="680" height="40" class="card" filter="url(#shadow-glow)"/>

    <!-- Left Glowing Accent Bar -->
    <line x1="8" y1="10" x2="8" y2="30" class="accent-bar" filter="url(#shadow-glow)"/>

    <!-- Horizontally Centered Globe Icon + Text Group -->
    <g transform="translate(98, 0)">
      <!-- Globe Icon -->
      <g transform="translate(0, 11)">
        <circle cx="9" cy="9" r="8" stroke="#60a5fa" stroke-width="1.6" fill="none"/>
        <path d="M1,9 L17,9 M9,1 C6.5,3.5 6.5,14.5 9,17 M9,1 C11.5,3.5 11.5,14.5 9,17" stroke="#60a5fa" stroke-width="1.4" fill="none"/>
      </g>

      <!-- Tagline Text -->
      <text x="28" y="25" class="text-tagline">AI &amp; Machine Learning Powered Rural &amp; Urban Healthcare Platform</text>
    </g>
  </g>
</svg>
