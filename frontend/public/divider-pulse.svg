<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 16" width="100%" height="16" fill="none">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#fd6b05"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow-divider" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Static Base Line -->
  <line x1="0" y1="8" x2="800" y2="8" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>

  <!-- ECG Wave Sweep Line -->
  <path stroke="url(#divider-grad)" stroke-width="2.5" fill="none" filter="url(#glow-divider)" d="M0,8 L370,8 L376,5 L382,8 L387,8 L392,12 L397,2 L400,8 L403,14 L408,8 L413,8 L420,5 L426,8 L800,8" />

  <!-- Center Pulse Dot -->
  <circle cx="400" cy="8" r="2.5" fill="#38bdf8" filter="url(#glow-divider)" />
</svg>

