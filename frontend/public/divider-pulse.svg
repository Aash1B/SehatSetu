<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 16" width="100%" height="16" fill="none">
  <style>
    .bg-line { stroke: #1e293b; stroke-width: 1.5; opacity: 0.6; }
    .pulse-line {
      stroke: url(#divider-grad);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: sweep 3s linear infinite;
    }
    @keyframes sweep {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#fd6b05"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow-divider" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Static Base Line -->
  <line x1="0" y1="8" x2="800" y2="8" class="bg-line"/>

  <!-- Animated ECG Wave Sweep Line -->
  <path class="pulse-line" filter="url(#glow-divider)" d="M0,8 L360,8 L366,8 L371,2 L376,14 L381,-2 L386,18 L391,5 L396,8 L800,8" />

  <!-- Animated Center Pulse Dot -->
  <circle cx="381" cy="8" r="2.5" fill="#38bdf8" filter="url(#glow-divider)">
    <animate attributeName="r" values="1.5;4;1.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
