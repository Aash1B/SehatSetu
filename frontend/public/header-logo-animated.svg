<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 75" width="380" height="75" fill="none">
  <style>
    .glow-title-white {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: #ffffff;
    }
    .glow-title-blue {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: #2563eb;
    }
    .logo-pulse {
      transform-origin: 28px 28px;
      animation: pulse 2s ease-in-out infinite alternate;
    }
    .ecg-line {
      stroke: url(#ecg-grad);
      stroke-width: 2.5;
      fill: none;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: dash 3s linear infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(253, 107, 5, 0.4)); }
      100% { transform: scale(1.06); filter: drop-shadow(0 0 10px rgba(253, 107, 5, 0.8)); }
    }
    @keyframes dash {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <linearGradient id="ecg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fd6b05" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#fd6b05" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Logo Group with Pulsing Effect -->
  <g class="logo-pulse" transform="translate(4, 4)">
    <rect x="0" y="0" width="54" height="54" rx="14" fill="#fd6b05"/>
    <!-- House contour -->
    <path d="M27,12 L13,23 L17,23 L17,40 L37,40 L37,23 L41,23 Z" fill="#ffffff"/>
    <!-- Orange Cross inside house -->
    <path d="M27,24 L27,34 M22,29 L32,29" stroke="#fd6b05" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- SehatSetu Brand Title Group -->
  <g transform="translate(74, 42)">
    <text class="glow-title-white">Sehat<tspan class="glow-title-blue">Setu</tspan></text>
  </g>

  <!-- Animated ECG Heartbeat Pulse Line below Title -->
  <path class="ecg-line" filter="url(#glow-effect)" d="M74,58 L180,58 L187,58 L193,46 L199,68 L205,38 L211,72 L217,54 L223,58 L370,58" />

  <!-- Animated Pulse Node -->
  <circle cx="205" cy="38" r="3.5" fill="#38bdf8" filter="url(#glow-effect)">
    <animate attributeName="r" values="2;5;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
