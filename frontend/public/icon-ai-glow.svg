<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="32" height="32" fill="none">
  <defs>
    <filter id="glow-ai" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.9"/>
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g transform="translate(2, 2)" filter="url(#glow-ai)">
    <rect x="5" y="7" width="22" height="18" rx="5" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="3" width="4" height="4" fill="#a855f7"/>
    <circle cx="11" cy="14" r="2.5" fill="#60a5fa"/>
    <circle cx="21" cy="14" r="2.5" fill="#60a5fa"/>
    <path d="M11 20 L21 20" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
