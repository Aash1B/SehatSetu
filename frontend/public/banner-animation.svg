<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="120" fill="none">
  <style>
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.4; }
    .ecg-bg { stroke: rgba(37, 99, 235, 0.15); stroke-width: 3; fill: none; }
    .ecg-main {
      stroke: url(#ecg-gradient);
      stroke-width: 3.5;
      fill: none;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 3.5s linear infinite;
    }
    .glow-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 22px;
      fill: #ffffff;
    }
    .sub-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
    }
    @keyframes dash {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <linearGradient id="ecg-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#fd6b05"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>
    
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background card -->
  <rect width="800" height="120" rx="16" fill="url(#bg-gradient)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Background Grid lines -->
  <line x1="0" y1="30" x2="800" y2="30" class="grid"/>
  <line x1="0" y1="60" x2="800" y2="60" class="grid"/>
  <line x1="0" y1="90" x2="800" y2="90" class="grid"/>

  <!-- Animated ECG Heartbeat Wave -->
  <path class="ecg-bg" d="M0,60 L200,60 L215,60 L225,35 L235,85 L245,20 L255,95 L265,50 L275,60 L380,60 L390,60 L400,35 L410,85 L420,20 L430,95 L440,50 L450,60 L800,60" />
  <path class="ecg-main" filter="url(#glow)" d="M0,60 L200,60 L215,60 L225,35 L235,85 L245,20 L255,95 L265,50 L275,60 L380,60 L390,60 L400,35 L410,85 L420,20 L430,95 L440,50 L450,60 L800,60" />

  <!-- Animated Glowing Pulse Nodes -->
  <circle cx="245" cy="20" r="4.5" fill="#fd6b05" filter="url(#glow)">
    <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="20" r="4.5" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="r" values="3;6;3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- Left Content Group -->
  <g transform="translate(28, 30)">
    <!-- House/Cross Logo Icon -->
    <rect x="0" y="0" width="44" height="44" rx="12" fill="#fd6b05" fill-opacity="0.15" stroke="#fd6b05" stroke-width="1.5"/>
    <path d="M22,12 L12,20 L15,20 L15,31 L29,31 L29,20 L32,20 Z" fill="#fd6b05"/>
    <path d="M22,21 L22,27 M19,24 L25,24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- SehatSetu Brand Title -->
    <text x="60" y="27" class="glow-text">Sehat<tspan fill="#2563eb">Setu</tspan></text>
    <text x="60" y="46" class="sub-text">AI Telemedicine &amp; Healthcare Platform</text>
  </g>

  <!-- Right Online Indicator Badge -->
  <g transform="translate(625, 44)">
    <rect x="0" y="0" width="145" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="20" class="badge-text" fill="#38bdf8">Live Telehealth</text>
  </g>
</svg>
