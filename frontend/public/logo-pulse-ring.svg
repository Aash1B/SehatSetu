<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72">
  <defs>
    <filter id="ring-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Soft Animated Glowing Pulse Rings Behind Original Logo -->
  <circle cx="36" cy="36" r="32" fill="none" stroke="#FD6B05" stroke-width="2.5" opacity="0.8" filter="url(#ring-glow)">
    <animate attributeName="r" values="26;34;26" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.15;0.85" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-width" values="3.5;1;3.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="36" cy="36" r="29" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.5" filter="url(#ring-glow)">
    <animate attributeName="r" values="24;31;24" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- Original Logo Reference -->
  <image href="./logo.svg" x="8" y="8" width="56" height="56"/>
</svg>
