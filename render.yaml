services:
  - type: web
    name: sehat-setu-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_API_KEY
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: "120000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: medical-reports
      - key: MEDICAL_REPORT_MAX_FILE_SIZE_BYTES
        value: "20971520"
      - key: MEDICAL_REPORT_DOWNLOAD_URL_TTL_SECONDS
        value: "300"
      - key: FASTAPI_BASE_URL
        sync: false
      - key: FASTAPI_INTERNAL_API_KEY
        sync: false
      - key: FASTAPI_OCR_TIMEOUT_MS
        value: "120000"
      - key: FASTAPI_OCR_MAX_RETRIES
        value: "1"

  - type: web
    name: sehat-setu-ai
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: OCR_MODE
        value: local-first
      - key: OCR_FALLBACK_THRESHOLD
        value: "0.60"
      - key: OCR_CACHE_TTL_SECONDS
        value: "300"
      - key: OCR_MAX_CONCURRENT_REQUESTS
        value: "2"
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: INTERNAL_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
      - key: GEMINI_MAX_RETRIES
        value: "2"
