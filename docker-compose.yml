services:
  postgres:
    image: postgres:17
    container_name: sehat-setu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sehat_setu
    ports:
      - "5433:5432"
    volumes:
      - sehat_setu_pgdata:/var/lib/postgresql/data

volumes:
  sehat_setu_pgdata: